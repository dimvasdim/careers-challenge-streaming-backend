services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: teton
      POSTGRES_PASSWORD: teton
      POSTGRES_DB: teton
    ports: ["5433:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teton -d teton"]
      interval: 2s
      timeout: 3s
      retries: 15

  service:
    build: ./service
    environment:
      DATABASE_URL: postgres://teton:teton@postgres:5432/teton
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 10s # SIGTERM -> drain ingest queue before SIGKILL

volumes:
  pgdata:
