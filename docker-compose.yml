services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: teton
      POSTGRES_PASSWORD: teton
      POSTGRES_DB: teton
    ports: ["5433:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: